<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search — Metabolic engineering</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;--paper:#fff;--surface:#f5f5f7;--ink:#1d1d1f;--ink2:#6e6e73;--line:rgba(0,0,0,.08);--blue:#0071e3;--nav:rgba(255,255,255,.84);--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--paper:#000;--surface:#1c1c1e;--ink:#f5f5f7;--ink2:#a1a1a6;--line:rgba(255,255,255,.1);--blue:#5aa9ff;--nav:rgba(0,0,0,.74)}}
*{box-sizing:border-box}.skip{position:fixed;left:12px;top:-80px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;font-size:13px;text-decoration:none}.skip:focus{top:12px}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;letter-spacing:-.012em}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:9px max(24px,calc((100vw - 1000px)/2));background:var(--nav);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.bar a{color:var(--ink2);text-decoration:none}.bar a:hover{color:var(--blue)}
main{max-width:820px;margin:0 auto;padding:56px 24px 90px}
h1{font-size:clamp(36px,6vw,56px);letter-spacing:-.04em;line-height:1.05;margin:0 0 10px}
.lead{color:var(--ink2);margin:0 0 26px;max-width:60ch}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.16)}
.results{margin-top:22px;border-top:1px solid var(--line)}
.result{display:block;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.result:hover{background:var(--surface)}
.result b{display:block;font-size:16px;margin-bottom:2px}.result span{display:block;font-size:12.5px;color:var(--ink2)}
.empty{color:var(--ink2);padding:24px 0;font-size:14px}
footer{max-width:820px;margin:0 auto;padding:20px 24px 50px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
footer a{color:var(--ink2);text-decoration:none}footer a:hover{color:var(--blue)}
@media(max-width:600px){main{padding:40px 18px 70px}.bar{padding:8px 16px}footer{padding:18px 18px 40px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar"><a href="index.html">← Course home</a><span>Search</span></header>
<main id="main">
<p class="lead">Metabolic engineering · 55 weeks</p>
<h1>Search</h1>
<p class="lead">Weeks, handbooks, audit files and practice labs.</p>
<label for="q">Search the module</label>
<input id="q" type="search" placeholder="Try “ATP”, “FBA”, “case study”, “rubric”…" autocomplete="off" autofocus>
<div class="results" id="results" aria-live="polite"><p class="empty">Type to search.</p></div>
</main>
<footer><a href="index.html">Course home</a> · <a href="AUDIT.md">Assurance</a> · <a href="README.txt">README</a></footer>
<script>
(function(){
  var input=document.getElementById("q"), out=document.getElementById("results"), data=null;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function render(q){
    if(!data){out.innerHTML='<p class="empty">Search index did not load. Open the site over HTTP.</p>';return}
    q=q.trim().toLowerCase();
    if(!q){out.innerHTML='<p class="empty">Type to search.</p>';return}
    var hits=data.filter(function(x){return (x.title+" "+x.meta+" "+x.text).toLowerCase().indexOf(q)>=0}).slice(0,20);
    if(!hits.length){out.innerHTML='<p class="empty">No matches.</p>';return}
    out.innerHTML=hits.map(function(x){return '<a class="result" href="'+esc(x.url)+'"><b>'+esc(x.title)+'</b><span>'+esc(x.type)+' · '+esc(x.meta)+'</span></a>'}).join("");
  }
  fetch("search-index.json").then(function(r){return r.json()}).then(function(d){data=d;render(input.value)}).catch(function(){render(input.value)});
  input.addEventListener("input",function(){render(input.value)});
})();
</script>
</body>
</html>
